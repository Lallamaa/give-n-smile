<!--Charity Organization Register-->
<!DOCTYPE html>
<html>
<head>
    <title>(name)-Sign Up</title>
    <!-- CSS only -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
<!-- JavaScript Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW" crossorigin="anonymous"></script>
</head>
<body>
    <form method="get" action=".php">
        <legend>Charity Organization Sign Up </legend>
        <fieldset>
            <p> Username: <input type="text" name="coName" required maxlength="50" placeholder="(Max 20 characters)"></p>
            <p> Email: <input type="email" name="coEmail" required placeholder="Enter your email" ></p>
            <p> Password: <input type="password" name="logPwd" required maxlength="16"  ></p>
   
            <p> Website Link: <input type="url" name="coWeb" placeholder="If have any (optional)" ></p>
            <p> Facebook Link: <input type="url" name="coFb" placeholder="If have any (optional)" ></p>
            <p> Extra Social Media Link: <select name="xtraLink">
                                        <option> Instagram </option>
                                        <option> Snapchat </option>
                                        <option> LinkedIn </option>
                                        <option> Twitter </option>
            </select></p>
            <p> Describe: <textarea name="coDes" placeholder="Describe yourself"></textarea> </p>
            <p> Adress: <input type="text" name="coAdd" placeholder="Enter your full address here"></p>
            <script type="text/javascript" src="script.js"></script>
            <p> Address Line 1 <input type="text" name="add1" required /></p>
            <p> Address Line 2 <input type="text" name="add2" required /></p>
            <p> City/Town: <input type="text" name="city" required /></p>
            <p> State: <select name="state" onchange="Object()">
                <option> Perlis </option>
                <option> Kedah </option>
                <option> Penang </option>
                <option> Perak </option>
                <option> Selangor </option>
                <option> Negeri Sembilan </option>
                <option> Melaka </option>
                <option> Johor </option>
                <option> Pahang </option>
                <option> Terengganu </option>
                <option> Kelantan </option>
                <option> Sabah </option>
                <option> Sarawak </option>
            </select></p>
            <p> Zip/Postal Code: <input type="text" name="postCode" required /></p>
            <p> Phone No.: <input type="number" name="coNo" required maxlength="11" placeholder="Enter your phone no." ></p>
            </fieldset>
        </form>
    </body>
</html>
