<!DOCTYPE html>
<html>
<head>
    <title>(name)-Sign Up</title>
</head>
<body>
    <form method="get" action=".php">
        <legend>User Sign Up </legend>
        <fieldset>
            <p> Username: <input type="text" name="userName" required maxlength="50" placeholder="(Max 20 characters)"></p>
            <p> Email: <input type="email" name="userEmail" required placeholder="Enter your email"></p>
            <p> Phone No.: <input type="number" name="userNo" required maxlength="11" placeholder="Enter your phone no."></p>
            <p> Password: <input type="password" name="logPwd" required maxlength="16"></p>
        </fieldset>
    </form>
</body>
</html>
